<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="90mm" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual de la capa de interacción</title>
  <desc id="desc">La persona usuaria descarga desde Nginx el cliente Expo estático, que conecta directamente con el servidor WebSocket o la API REST de Nanobot; la TUI instala, configura y controla el entorno por separado.</desc>
  <defs>
    <marker id="arrowStandard" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrowExternal" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
    <style><![CDATA[
      text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}.title{font-size:44px;font-weight:700}.subtitle{font-size:30px;fill:#475569}
      .actor{fill:#FFFFFF;stroke:#475569;stroke-width:6}.client{fill:#DBEAFE;stroke:#1D4ED8;stroke-width:6}
      .gateway{fill:#E0E7FF;stroke:#4338CA;stroke-width:7}.primary{fill:#DBEAFE;stroke:#1D4ED8;stroke-width:5}
      .alternate{fill:#F8FAFC;stroke:#64748B;stroke-width:5;stroke-dasharray:14 8}.agent{fill:#CFFAFE;stroke:#0E7490;stroke-width:6}
      .management{fill:#F8FAFC;stroke:#64748B;stroke-width:6}.nodeTitle{font-size:36px;font-weight:700;text-anchor:middle}.body{font-size:30px;text-anchor:middle}.small{font-size:30px;text-anchor:middle;fill:#475569}
      .arrow{fill:none;stroke:#475569;stroke-width:7;marker-end:url(#arrowStandard)}.return{stroke:#1D4ED8;marker-end:url(#arrowReturn)}
    ]]></style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text class="title" x="45" y="68">Capa de interacción y canales de comunicación</text>
  <text class="subtitle" x="45" y="112">Cliente estático servido por Nginx; TUI independiente para gestionar el entorno</text>

  <rect class="actor" x="40" y="335" width="205" height="190" rx="24"/>
  <text class="nodeTitle" x="142" y="402"><tspan x="142">Persona</tspan><tspan x="142" dy="43">usuaria</tspan></text>
  <text class="small" x="142" y="492">actor único</text>

  <rect class="client" x="325" y="160" width="345" height="270" rx="24"/>
  <text class="nodeTitle" x="497" y="210"><tspan x="497">Cliente web</tspan><tspan x="497" dy="40">estático</tspan></text>
  <text class="body" x="497" y="305"><tspan x="497">React Native Web</tspan><tspan x="497" dy="36">con Expo</tspan><tspan x="497" dy="36">Nginx · puerto 8081</tspan></text>
  <rect class="client" x="325" y="520" width="315" height="210" rx="24"/>
  <text class="nodeTitle" x="482" y="585">TUI en Python</text>
  <text class="body" x="482" y="625"><tspan x="482">instalación</tspan><tspan x="482" dy="38">configuración</tspan><tspan x="482" dy="38">estado y diagnóstico</tspan></text>

  <rect class="gateway" x="735" y="150" width="390" height="350" rx="28"/>
  <text class="nodeTitle" x="930" y="195"><tspan x="930">Canales directos</tspan><tspan x="930" dy="40">con Nanobot</tspan></text>
  <rect class="primary" x="765" y="260" width="330" height="80" rx="18"/>
  <text class="body" x="930" y="288"><tspan x="930">Servidor WebSocket</tspan><tspan x="930" dy="34">principal · streaming</tspan></text>
  <rect class="alternate" x="790" y="365" width="280" height="110" rx="18"/>
  <text class="body" x="930" y="397"><tspan x="930">API REST</tspan><tspan x="930" dy="34">con aiohttp</tspan><tspan x="930" dy="34">canal alternativo</tspan></text>

  <rect class="management" x="735" y="555" width="390" height="175" rx="24"/>
  <text class="nodeTitle" x="930" y="610">Gestión del entorno</text>
  <text class="body" x="930" y="655"><tspan x="930">instalación · configuración</tspan><tspan x="930" dy="38">estado · diagnóstico</tspan></text>

  <rect class="agent" x="1235" y="335" width="315" height="210" rx="24"/>
  <text class="nodeTitle" x="1392" y="405">Nanobot</text>
  <text class="body" x="1392" y="465"><tspan x="1392">sesión, agente</tspan><tspan x="1392" dy="40">y herramientas</tspan></text>

  <path class="arrow" d="M245 400 H280 V295 H325"/>
  <path class="arrow" d="M245 470 H280 V625 H325"/>
  <path class="arrow" d="M670 295 H735"/>
  <path class="arrow" d="M640 625 H735"/>
  <path class="arrow" d="M1125 365 H1235"/>
  <path class="arrow return" d="M1235 400 H1125"/>
  <text class="small" x="800" y="790"><tspan x="800">Nginx entrega la SPA; el navegador conecta directamente con Nanobot por WebSocket o REST</tspan><tspan x="800" dy="38">La TUI gestiona el entorno y no actúa como cliente conversacional</tspan></text>
</svg>
