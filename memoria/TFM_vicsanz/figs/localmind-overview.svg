<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="90mm" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual de LocalMind-AI</title>
  <desc id="desc">La persona usuaria interactúa con cuatro subsistemas locales y puede autorizar servicios externos opcionales.</desc>
  <defs>
    <marker id="arrowStandard" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arrowExternal" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
    <style><![CDATA[
      text{font-family:Arial,Helvetica,sans-serif;fill:#0F172A}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:30px;fill:#475569}
      .boundary{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:6}.actor{fill:#FFFFFF;stroke:#475569;stroke-width:6}
      .client{fill:#DBEAFE;stroke:#1D4ED8;stroke-width:6}.comm{fill:#E0E7FF;stroke:#4338CA;stroke-width:6}
      .agent{fill:#CFFAFE;stroke:#0E7490;stroke-width:6}.service{fill:#D1FAE5;stroke:#047857;stroke-width:6}
      .external{fill:#FEF3C7;stroke:#B45309;stroke-width:6;stroke-dasharray:16 10}
      .nodeTitle{font-size:32px;font-weight:700;text-anchor:middle}.body{font-size:30px;text-anchor:middle}.small{font-size:30px;text-anchor:middle;fill:#475569}
      .arrow{fill:none;stroke:#475569;stroke-width:7;marker-end:url(#arrowStandard)}.externalLink{stroke:#B45309;stroke-dasharray:16 10;marker-end:url(#arrowExternal)}
    ]]></style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text class="title" x="45" y="68">LocalMind-AI: asistencia personal con procesamiento local</text>
  <text class="subtitle" x="45" y="112">Cuatro subsistemas coordinados y salidas externas desactivadas por defecto</text>

  <rect class="boundary" x="275" y="155" width="1280" height="500" rx="28"/>
  <text class="subtitle" x="315" y="205">Ámbito local: computación, documentos y memoria en el equipo</text>

  <rect class="actor" x="35" y="280" width="195" height="240" rx="24"/>
  <text class="nodeTitle" x="132" y="340"><tspan x="132">Persona</tspan><tspan x="132" dy="40">usuaria</tspan></text>
  <text class="small" x="132" y="430"><tspan x="132">instala</tspan><tspan x="132" dy="32">configura</tspan><tspan x="132" dy="32">y utiliza</tspan></text>

  <rect class="client" x="310" y="255" width="260" height="300" rx="24"/>
  <text class="nodeTitle" x="440" y="325"><tspan x="440">Interacción</tspan></text>
  <text class="body" x="440" y="365"><tspan x="440">Cliente web</tspan><tspan x="440" dy="36">React Native</tspan><tspan x="440" dy="36">con Expo</tspan><tspan x="440" dy="36">TUI: gestión</tspan><tspan x="440" dy="36">del entorno</tspan></text>

  <rect class="comm" x="620" y="255" width="250" height="300" rx="24"/>
  <text class="nodeTitle" x="745" y="325">Comunicación</text>
  <text class="body" x="745" y="380"><tspan x="745">WebSocket</tspan><tspan x="745" dy="38">canal principal</tspan><tspan x="745" dy="38">REST con aiohttp</tspan></text>

  <rect class="agent" x="920" y="255" width="260" height="300" rx="24"/>
  <text class="nodeTitle" x="1050" y="325">Aplicación</text>
  <text class="body" x="1050" y="370"><tspan x="1050">Nanobot</tspan><tspan x="1050" dy="36">sesiones</tspan><tspan x="1050" dy="36">progreso</tspan><tspan x="1050" dy="36">resumido</tspan><tspan x="1050" dy="36">orquestación</tspan></text>

  <rect class="service" x="1230" y="255" width="285" height="300" rx="24"/>
  <text class="nodeTitle" x="1372" y="310"><tspan x="1372">Servicios</tspan><tspan x="1372" dy="38">locales</tspan></text>
  <text class="body" x="1372" y="400"><tspan x="1372">Ollama / oMLX</tspan><tspan x="1372" dy="38">ChromaDB</tspan><tspan x="1372" dy="38">memoria</tspan><tspan x="1372" dy="38">herramientas MCP</tspan></text>

  <path class="arrow" d="M230 400 H310"/>
  <path class="arrow" d="M570 405 H620"/>
  <path class="arrow" d="M870 405 H920"/>
  <path class="arrow" d="M1180 405 H1230"/>

  <rect class="external" x="1110" y="690" width="405" height="175" rx="22"/>
  <text class="nodeTitle" x="1312" y="730"><tspan x="1312">Servicios externos</tspan><tspan x="1312" dy="37">opcionales</tspan></text>
  <text class="body" x="1312" y="815"><tspan x="1312">solo con activación</tspan><tspan x="1312" dy="36">o consentimiento</tspan></text>
  <path class="arrow externalLink" d="M1372 555 V690"/>
</svg>
